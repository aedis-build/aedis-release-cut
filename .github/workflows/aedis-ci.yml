# Quality pipeline of this action: Conventional Commits, SAST (Semgrep with the Aedis rules) and REUSE through the
# Aedis Platform reusables, plus the self-tests of the scripts. The gate (gate.yml) listens for the end of this
# workflow on pull requests.
name: aedis-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One run per pull request: a new push or closing the PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  commits:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/conventional-commits.yml@c096e93f15a76e52fa793868fc82b74587cb9ca0 # v1.2.0
    permissions:
      contents: read

  sast:
    if: github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/sast.yml@c096e93f15a76e52fa793868fc82b74587cb9ca0 # v1.2.0
    permissions:
      contents: read
      security-events: write

  test:
    if: github.event.action != 'closed'
    name: Self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/next-version.sh --self-test
      - run: bash scripts/check-conventional-commits.sh --self-test
      - run: bash scripts/mode.sh --self-test
      - run: pipx run reuse==5.0.2 lint
